<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Arithmetic Maze Race</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .game-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 20px;
            max-width: 700px;
            width: 100%;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .legend {
            text-align: center;
            font-size: 12px;
            color: #666;
            margin-bottom: 15px;
        }
        
        #gameCanvas {
            border: 2px solid #333;
            display: block;
            background: #e8e8e8;
            margin: 0 auto 15px;
            cursor: crosshair;
        }
        
        .timer-bar {
            height: 14px;
            background: #ddd;
            border-radius: 4px;
            margin-bottom: 15px;
            overflow: hidden;
        }
        
        #timerFill {
            height: 100%;
            background: #4CAF50;
            width: 0%;
            transition: all 0.1s linear;
        }
        
        .question-section {
            display: grid;
            grid-template-columns: auto 1fr auto auto;
            gap: 10px;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .question-section label {
            font-weight: bold;
            color: #333;
        }
        
        #questionLabel {
            font-size: 16px;
            font-weight: bold;
            color: #1565C0;
            padding: 8px 12px;
            background: #f0f0f0;
            border-radius: 4px;
            text-align: center;
            min-width: 140px;
        }
        
        #answerInput {
            padding: 8px 12px;
            font-size: 14px;
            border: 2px solid #ddd;
            border-radius: 4px;
            width: 80px;
            text-align: center;
        }
        
        #answerInput:focus {
            outline: none;
            border-color: #1565C0;
            box-shadow: 0 0 5px rgba(21,101,192,0.3);
        }
        
        #submitBtn {
            padding: 8px 16px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.3s;
        }
        
        #submitBtn:hover:not(:disabled) {
            background: #1565C0;
        }
        
        #submitBtn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 13px;
        }
        
        #statusMsg {
            color: #1565C0;
            font-weight: bold;
            flex: 1;
        }
        
        #scoreLabel {
            color: #333;
            font-weight: bold;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }
        
        .btn-primary {
            flex: 1;
            padding: 12px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .btn-primary:hover:not(:disabled) {
            background: #45a049;
        }
        
        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .btn-secondary {
            flex: 1;
            padding: 12px 20px;
            background: #f44336;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .btn-secondary:hover {
            background: #da190b;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        
        .modal-content h2 {
            font-size: 24px;
            color: #333;
            margin-bottom: 10px;
        }
        
        .modal-content .winner-msg {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #2e7d32;
        }
        
        .modal-content .winner-msg.ai-wins {
            color: #c62828;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 20px 0;
            text-align: left;
            font-size: 14px;
        }
        
        .stat-item {
            padding: 10px;
            background: #f5f5f5;
            border-radius: 4px;
        }
        
        .stat-label {
            font-weight: bold;
            color: #666;
        }
        
        .stat-value {
            color: #1565C0;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="game-container">
    <h1>🧮 AI Arithmetic Maze Race</h1>
    <div class="legend">
        🔵 You | 🔴 AI | 🟩 GOAL | 🟡 Click yellow cell to move
    </div>
    
    <canvas id="gameCanvas" width="420" height="420"></canvas>
    
    <div class="timer-bar">
        <div id="timerFill"></div>
    </div>
    
    <div class="question-section">
        <label>Question:</label>
        <div id="questionLabel">—</div>
        <input type="number" id="answerInput" placeholder="0" disabled>
        <button id="submitBtn" disabled>Submit ↵</button>
    </div>
    
    <div class="status-row">
        <div id="statusMsg">Press START to begin</div>
        <div id="scoreLabel">Score: 0</div>
    </div>
    
    <div class="button-group">
        <button class="btn-primary" id="startBtn">▶ START GAME</button>
    </div>
</div>

<div id="endModal" class="modal">
    <div class="modal-content">
        <h2>🏁 Challenge Complete!</h2>
        <div id="winnerMsg" class="winner-msg">YOU WIN!</div>
        <div class="stats-grid" id="statsGrid"></div>
        <div class="button-group">
            <button class="btn-primary" id="playAgainBtn">Play Again</button>
            <button class="btn-secondary" id="quitBtn">Quit</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const CELL_SIZE = 60;
    const GRID_ROWS = 7;
    const GRID_COLS = 7;
    const MOVE_TIME_S = 12;
    const START = [0, 0];
    const GOAL = [6, 4];
    const WALL_PROB = 0.22;
    const DIRECTIONS = [[-1,0],[1,0],[0,-1],[0,1]];
    
    let gameState = {
        playerPos: [...START],
        aiPos: [...START],
        maze: [],
        gameOver: false,
        started: false,
        canMove: false,
        moveDeadline: 0,
        playerScore: 0,
        playerMoves: 0,
        aiMoves: 0,
        correctAnswers: 0,
        wrongAnswers: 0,
        totalAttempts: 0,
        startTime: null,
        playerWinTime: null,
        aiWinTime: null,
        currentQuestion: [1, '+', 1, 2],
        playerTrail: [],
        aiTrail: [],
        aiPath: [],
        aiPreviewPath: [],
        timerJob: null,
        astarVis: { open: new Set(), closed: new Set(), current: null }
    };
    
    function manhattan(a, b) {
        return Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]);
    }
    
    function generateMaze() {
        let grid;
        while (true) {
            grid = Array(GRID_ROWS).fill(null).map(() =>
                Array(GRID_COLS).fill(null).map(() => Math.random() > WALL_PROB ? 0 : 1)
            );
            grid[START[0]][START[1]] = 0;
            grid[GOAL[0]][GOAL[1]] = 0;
            for (let [dr, dc] of DIRECTIONS) {
                let nr = START[0] + dr;
                let nc = START[1] + dc;
                if (nr >= 0 && nr < GRID_ROWS && nc >= 0 && nc < GRID_COLS) {
                    grid[nr][nc] = 0;
                }
            }
            if (astar([...START], GOAL, grid).length > 0) {
                gameState.maze = grid;
                gameState.playerPos = [...START];
                gameState.aiPos = [...START];
                gameState.aiPath = astar([...START], GOAL, grid);
                gameState.playerTrail = [];
                gameState.aiTrail = [];
                return;
            }
        }
    }
    
    function astar(start, goal, maze) {
        let heap = [[manhattan(start, goal), 0, start]];
        let parent = new Map();
        let g = new Map();
        let closed = new Set();
        parent.set(JSON.stringify(start), null);
        g.set(JSON.stringify(start), 0);
        
        while (heap.length > 0) {
            heap.sort((a, b) => a[0] - b[0]);
            let [f, cost, cur] = heap.shift();
            let curStr = JSON.stringify(cur);
            
            if (closed.has(curStr)) continue;
            if (cur[0] === goal[0] && cur[1] === goal[1]) {
                let path = [];
                let node = cur;
                while (node !== null) {
                    path.unshift(node);
                    node = parent.get(JSON.stringify(node));
                }
                return path;
            }
            closed.add(curStr);
            
            for (let [dr, dc] of DIRECTIONS) {
                let nr = cur[0] + dr;
                let nc = cur[1] + dc;
                if (nr >= 0 && nr < GRID_ROWS && nc >= 0 && nc < GRID_COLS && maze[nr][nc] === 0) {
                    let nb = [nr, nc];
                    let nbStr = JSON.stringify(nb);
                    let ng = cost + 1;
                    if (ng < (g.get(nbStr) || Infinity)) {
                        parent.set(nbStr, cur);
                        g.set(nbStr, ng);
                        heap.push([ng + manhattan(nb, goal), ng, nb]);
                    }
                }
            }
        }
        return [];
    }
    
    function getValidNeighbours(pos) {
        let result = [];
        for (let [dr, dc] of DIRECTIONS) {
            let nr = pos[0] + dr;
            let nc = pos[1] + dc;
            if (nr >= 0 && nr < GRID_ROWS && nc >= 0 && nc < GRID_COLS && gameState.maze[nr][nc] === 0) {
                result.push([nr, nc]);
            }
        }
        return result;
    }
    
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        let validMoves = gameState.canMove && !gameState.gameOver ? getValidNeighbours(gameState.playerPos) : [];
        
        for (let r = 0; r < GRID_ROWS; r++) {
            for (let c = 0; c < GRID_COLS; c++) {
                let x1 = c * CELL_SIZE;
                let y1 = r * CELL_SIZE;
                let x2 = x1 + CELL_SIZE;
                let y2 = y1 + CELL_SIZE;
                
                let fill = '#f5f5e8';
                if (gameState.maze[r][c] === 1) {
                    fill = '#1a1a1a';
                } else if (r === GOAL[0] && c === GOAL[1]) {
                    fill = '#2e7d32';
                } else if (validMoves.some(m => m[0] === r && m[1] === c)) {
                    fill = '#ffe066';
                }
                
                ctx.fillStyle = fill;
                ctx.fillRect(x1, y1, CELL_SIZE, CELL_SIZE);
                ctx.strokeStyle = '#bbb';
                ctx.strokeRect(x1, y1, CELL_SIZE, CELL_SIZE);
            }
        }
        
        // Draw trails
        for (let [r, c] of gameState.playerTrail) {
            ctx.fillStyle = '#9fd3ff';
            ctx.fillRect(c * CELL_SIZE + 3, r * CELL_SIZE + 3, CELL_SIZE - 6, CELL_SIZE - 6);
        }
        for (let [r, c] of gameState.aiTrail) {
            ctx.fillStyle = '#ffd98a';
            ctx.fillRect(c * CELL_SIZE + 3, r * CELL_SIZE + 3, CELL_SIZE - 6, CELL_SIZE - 6);
        }
        
        // Draw GOAL text
        ctx.fillStyle = 'white';
        ctx.font = 'bold 12px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('GOAL', GOAL[1] * CELL_SIZE + CELL_SIZE / 2, GOAL[0] * CELL_SIZE + CELL_SIZE / 2);
        
        // Draw agents
        drawAgent(gameState.playerPos, '#1565C0', 'YOU');
        drawAgent(gameState.aiPos, '#C62828', 'AI');
        
        // Glow when can move
        if (gameState.canMove && !gameState.gameOver) {
            ctx.strokeStyle = '#FFD700';
            ctx.lineWidth = 4;
            let cx = gameState.playerPos[1] * CELL_SIZE + CELL_SIZE / 2;
            let cy = gameState.playerPos[0] * CELL_SIZE + CELL_SIZE / 2;
            let rad = CELL_SIZE / 3 + 6;
            ctx.beginPath();
            ctx.arc(cx, cy, rad, 0, Math.PI * 2);
            ctx.stroke();
        }
    }
    
    function drawAgent(pos, color, label) {
        let cx = pos[1] * CELL_SIZE + CELL_SIZE / 2;
        let cy = pos[0] * CELL_SIZE + CELL_SIZE / 2;
        let radius = CELL_SIZE / 3;
        
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'white';
        ctx.lineWidth = 2;
        ctx.stroke();
        
        ctx.fillStyle = 'white';
        ctx.font = 'bold 10px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, cx, cy);
    }
    
    function drawTimerBar(fraction) {
        let timerFill = document.getElementById('timerFill');
        let width = Math.max(0, Math.min(100, fraction * 100));
        timerFill.style.width = width + '%';
        
        if (width > 40) timerFill.style.background = '#4CAF50';
        else if (width > 20) timerFill.style.background = '#FF9800';
        else timerFill.style.background = '#f44336';
    }
    
    function newQuestion() {
        let a = Math.floor(Math.random() * 12) + 1;
        let b = Math.floor(Math.random() * 12) + 1;
        let ops = ['+', '-', '*'];
        let op = ops[Math.floor(Math.random() * ops.length)];
        let ans = op === '+' ? a + b : (op === '-' ? a - b : a * b);
        
        gameState.currentQuestion = [a, op, b, ans];
        document.getElementById('questionLabel').textContent = `${a} ${op} ${b} = ?`;
        document.getElementById('answerInput').value = '';
        document.getElementById('answerInput').focus();
        document.getElementById('statusMsg').textContent = '🤔 Solve the question to earn a move!';
        gameState.canMove = false;
        drawTimerBar(0);
        draw();
    }
    
    function submit() {
        if (gameState.gameOver || !gameState.started) return;
        
        let raw = document.getElementById('answerInput').value.trim();
        let val = parseInt(raw);
        if (isNaN(val)) {
            alert('Enter a whole number.');
            return;
        }
        
        let [, , , ans] = gameState.currentQuestion;
        gameState.totalAttempts++;
        document.getElementById('answerInput').value = '';
        
        if (val === ans) {
            gameState.correctAnswers++;
            gameState.playerScore++;
            document.getElementById('scoreLabel').textContent = `Score: ${gameState.playerScore}`;
            gameState.canMove = true;
            document.getElementById('statusMsg').textContent = '✅ Correct! Click a YELLOW cell to move ⬆⬇⬅➡';
            startMoveTimer();
            draw();
        } else {
            gameState.wrongAnswers++;
            document.getElementById('statusMsg').textContent = '❌ Wrong! New question coming…';
            newQuestion();
        }
    }
    
    function startMoveTimer() {
        cancelTimer();
        gameState.moveDeadline = Date.now() + MOVE_TIME_S * 1000;
        
        function tick() {
            if (gameState.gameOver || !gameState.started || !gameState.canMove) {
                drawTimerBar(0);
                return;
            }
            let remaining = (gameState.moveDeadline - Date.now()) / 1000;
            let frac = Math.max(0, remaining / MOVE_TIME_S);
            drawTimerBar(frac);
            if (remaining <= 0) {
                timeExpired();
            } else {
                gameState.timerJob = setTimeout(tick, 100);
            }
        }
        tick();
    }
    
    function cancelTimer() {
        if (gameState.timerJob) {
            clearTimeout(gameState.timerJob);
            gameState.timerJob = null;
        }
    }
    
    function timeExpired() {
        cancelTimer();
        if (gameState.gameOver || !gameState.started) return;
        gameState.canMove = false;
        drawTimerBar(0);
        document.getElementById('statusMsg').textContent = '⏰ Time\'s up! AI moves, new question for you.';
        startAITurn();
    }
    
    function doPlayerMove(dest) {
        cancelTimer();
        gameState.canMove = false;
        gameState.playerTrail.push([...gameState.playerPos]);
        gameState.playerPos = [...dest];
        gameState.playerMoves++;
        drawTimerBar(0);
        draw();
        
        if (checkWinner()) return;
        startAITurn();
    }
    
    function startAITurn() {
        if (gameState.gameOver) return;
        gameState.aiPath = astar(gameState.aiPos, GOAL, gameState.maze);
        gameState.aiPreviewPath = gameState.aiPath.slice(1);
        draw();
        
        setTimeout(() => {
            gameState.aiPreviewPath = [];
            aiTakeStep();
            if (!gameState.gameOver) newQuestion();
        }, 550);
    }
    
    function aiTakeStep() {
        if (gameState.gameOver) return;
        gameState.aiPath = astar(gameState.aiPos, GOAL, gameState.maze);
        if (gameState.aiPath.length > 1) {
            gameState.aiTrail.push([...gameState.aiPos]);
            gameState.aiPos = [...gameState.aiPath[1]];
            gameState.aiMoves++;
            draw();
            checkWinner();
        }
    }
    
    function checkWinner() {
        if (gameState.playerPos[0] === GOAL[0] && gameState.playerPos[1] === GOAL[1] && !gameState.gameOver) {
            gameState.playerWinTime = Date.now();
            gameState.gameOver = true;
            endGame('player');
            return true;
        }
        if (gameState.aiPos[0] === GOAL[0] && gameState.aiPos[1] === GOAL[1] && !gameState.gameOver) {
            gameState.aiWinTime = Date.now();
            gameState.gameOver = true;
            endGame('ai');
            return true;
        }
        return false;
    }
    
    function endGame(winner) {
        gameState.started = false;
        cancelTimer();
        
        let pt = gameState.playerWinTime && gameState.startTime ? (gameState.playerWinTime - gameState.startTime) / 1000 : null;
        let at = gameState.aiWinTime && gameState.startTime ? (gameState.aiWinTime - gameState.startTime) / 1000 : null;
        
        let modal = document.getElementById('endModal');
        let winnerMsg = document.getElementById('winnerMsg');
        let statsGrid = document.getElementById('statsGrid');
        
        if (winner === 'player') {
            winnerMsg.textContent = '🎉 YOU WIN!';
            winnerMsg.classList.remove('ai-wins');
        } else {
            winnerMsg.textContent = '🤖 AI WINS!';
            winnerMsg.classList.add('ai-wins');
        }
        
        let stats = [
            ['Your moves', gameState.playerMoves, 'AI moves', gameState.aiMoves],
            ['Correct', gameState.correctAnswers, 'Wrong', gameState.wrongAnswers],
            ['Attempts', gameState.totalAttempts, '', '']
        ];
        if (pt) stats.push(['Your time', pt.toFixed(1) + 's', 'AI time', at ? at.toFixed(1) + 's' : '—']);
        
        statsGrid.innerHTML = '';
        for (let [la, va, lb, vb] of stats) {
            let div1 = document.createElement('div');
            div1.className = 'stat-item';
            div1.innerHTML = `<div class="stat-label">${la}</div><div class="stat-value">${va}</div>`;
            statsGrid.appendChild(div1);
            
            if (lb) {
                let div2 = document.createElement('div');
                div2.className = 'stat-item';
                div2.innerHTML = `<div class="stat-label">${lb}</div><div class="stat-value">${vb}</div>`;
                statsGrid.appendChild(div2);
            }
        }
        
        modal.classList.add('active');
    }
    
    function startGame() {
        gameState.started = true;
        gameState.gameOver = false;
        gameState.canMove = false;
        gameState.startTime = Date.now();
        gameState.playerWinTime = gameState.aiWinTime = null;
        gameState.playerScore = gameState.playerMoves = gameState.aiMoves = 0;
        gameState.correctAnswers = gameState.wrongAnswers = gameState.totalAttempts = 0;
        gameState.playerTrail = [];
        gameState.aiTrail = [];
        
        document.getElementById('scoreLabel').textContent = 'Score: 0';
        document.getElementById('startBtn').disabled = true;
        document.getElementById('answerInput').disabled = false;
        document.getElementById('submitBtn').disabled = false;
        
        generateMaze();
        newQuestion();
    }
    
    function resetGame() {
        cancelTimer();
        gameState.gameOver = gameState.started = gameState.canMove = false;
        gameState.playerScore = gameState.playerMoves = gameState.aiMoves = 0;
        gameState.correctAnswers = gameState.wrongAnswers = gameState.totalAttempts = 0;
        gameState.playerWinTime = gameState.aiWinTime = gameState.startTime = null;
        gameState.playerTrail = [];
        gameState.aiTrail = [];
        
        document.getElementById('scoreLabel').textContent = 'Score: 0';
        document.getElementById('startBtn').disabled = false;
        document.getElementById('answerInput').disabled = true;
        document.getElementById('submitBtn').disabled = true;
        document.getElementById('statusMsg').textContent = 'Press START to begin';
        document.getElementById('questionLabel').textContent = '—';
        drawTimerBar(0);
        
        generateMaze();
        draw();
    }
    
    // Event listeners
    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('submitBtn').addEventListener('click', submit);
    document.getElementById('answerInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') submit();
    });
    document.getElementById('playAgainBtn').addEventListener('click', () => {
        document.getElementById('endModal').classList.remove('active');
        resetGame();
    });
    document.getElementById('quitBtn').addEventListener('click', () => {
        resetGame();
        document.getElementById('endModal').classList.remove('active');
    });
    
    canvas.addEventListener('click', (e) => {
        if (!gameState.started || gameState.gameOver || !gameState.canMove) return;
        let c = Math.floor(e.offsetX / CELL_SIZE);
        let r = Math.floor(e.offsetY / CELL_SIZE);
        
        let validMoves = getValidNeighbours(gameState.playerPos);
        if (validMoves.some(m => m[0] === r && m[1] === c)) {
            doPlayerMove([r, c]);
        } else {
            document.getElementById('statusMsg').textContent = '⚠️ Click a yellow highlighted cell!';
        }
    });
    
    // Initialize
    generateMaze();
    draw();
</script>

</body>
</html>
